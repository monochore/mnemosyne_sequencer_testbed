<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNEMOSYNE - Shatter Engine</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap');
    :root {
        --bg: #0c0c0c; --panel: #111111; --border-main: #ffffff; --col-div: rgba(255, 255, 255, 0.22);
        --c-green: #00ff44; --c-amber: #ff9d00; --c-cyan: #00aaff; --c-red: #ff4444;
        --c-green-dim: #52a869; --c-amber-dim: #bf893b; --c-cyan-dim: #498eb8; --c-red-dim: #b85454;
        --text-dim: #bbbbbb;
    }
    body, #chassis, .column, .oled-container, .knob-container, #seq-shelf {
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body {
        background-color: var(--bg);
        color: #fff;
        font-family: 'Oswald', sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    /* WIDE LANDSCAPE CHASSIS (980px WIDE, LOCKED UPPER-DECK HEIGHT) */
    #chassis {
        display: flex;
        flex-direction: column;
        background-color: var(--panel);
        border: 2px solid var(--border-main);
        outline: 2px solid var(--border-main);
        outline-offset: -8px;
        padding: 12px;
        box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8);
        transform-origin: center center;
        width: 980px;
        box-sizing: border-box;
    }
    .upper-deck {
        display: grid;
        grid-template-columns: 60px 1fr 60px;
        width: 100%;
        height: 416px;
        box-sizing: border-box;
    }
    .vertical-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 6px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        width: 60px;
        height: 392px;
        box-sizing: border-box;
    }
    .panel-core {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-left: 1px solid var(--col-div);
        border-right: 1px solid var(--col-div);
        padding: 14px 0 12px 0;
        width: 100%;
        height: 416px;
        box-sizing: border-box;
    }

    .column {
        display: flex;
        flex-direction: column;
        align-items: center;
        border-right: 1px solid var(--col-div);
        padding: 0 12px;
        position: relative;
        box-sizing: border-box;
    }
    .column:last-child { border-right: none; }
    .col-header {
        font-size: 14px;
        letter-spacing: 2px;
        margin-bottom: 16px;
        text-transform: uppercase;
        color: var(--text-dim);
        height: 20px;
        text-align: center;
        transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .oled-container {
        width: 158px;
        background: #000;
        border: 1px solid #333;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 5px;
        box-sizing: border-box;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
    }
    #scope { width: 100%; height: 40px; background: #050505; margin-bottom: 6px; border: 1px solid #222; cursor: pointer; }
    .oled-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 5px; gap: 3px; }
    .oled-btn { flex: 1; background: transparent; border: 1px solid #555; color: #fff; font-family: 'Oswald', sans-serif; font-size: 9px; padding: 3px 0; cursor: pointer; text-transform: uppercase; transition: 0.1s; text-align: center; }
    .oled-btn:hover { background: #333; }
    .oled-btn.active { background: var(--border-main); color: #000; }
    .oled-btn.freeze { background: #111; border-color: var(--c-cyan); color: var(--c-cyan); font-weight: bold; font-size: 11px; padding: 5px 0; letter-spacing: 1px; }
    .oled-btn.freeze.active { background: var(--c-cyan); color: #000; box-shadow: 0 0 10px var(--c-cyan); }

    #ab-slider::-webkit-slider-thumb { appearance: none; width: 8px; height: 12px; background: #fff; cursor: pointer; }
    #preset-list { width: 100%; background: #000; color: var(--border-main); border: 1px solid #555; font-family: 'Oswald', sans-serif; font-size: 10px; outline: none; padding: 2px; }

    .knob-group { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; width: 100%; }
    .knob-row { display: flex; justify-content: space-evenly; width: 100%; margin-bottom: 16px; }
    .col-sys .knob-row { margin-bottom: 10px; }
    .col-sys .knob-group { margin-bottom: 4px; }
    .knob-container { display: flex; flex-direction: column; align-items: center; position: relative; }
    .knob-label { font-size: 10px; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
    .knob-svg { width: 44px; height: 44px; cursor: ns-resize; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); touch-action: none; }
    .knob-bg { fill: #1c1c1c; stroke-width: 2.5px; }
    .knob-indicator { stroke: #fff; stroke-width: 2.5px; stroke-linecap: round; }
    .knob-svg.plocked .knob-indicator { stroke: var(--c-red); stroke-width: 3.5px; }
    .knob-svg.mod-active .knob-indicator { stroke: var(--c-amber); }

    .col-sys .knob-bg { stroke: var(--c-green); } .col-sys .knob-label { color: var(--c-green); }
    .col-pat .knob-bg { stroke: var(--c-amber); } .col-pat .knob-label { color: var(--c-amber); }
    .col-tes .knob-bg { stroke: var(--c-cyan); }  .col-tes .knob-label { color: var(--c-cyan); }
    .col-des .knob-bg { stroke: var(--c-red); }   .col-des .knob-label { color: var(--c-red); }

    /* SHATTER MATRIX SCANLINE SEQUENCER & MOSAIC ALTAR SHELF */
    #seq-shelf {
        border-top: 1px solid var(--col-div);
        margin: 0;
        padding: 10px 12px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(0,0,0,0.42);
        box-sizing: border-box;
        width: 100%;
        position: relative;
        z-index: 2;
    }
    .seq-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
        white-space: nowrap;
    }
    .seq-section {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .seq-title {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-right: 4px;
    }
    .seq-btn {
        background: #080808;
        border: 1px solid #444;
        color: var(--text-dim);
        font-family: 'Oswald', sans-serif;
        font-size: 9.5px;
        letter-spacing: 1px;
        padding: 3px 7px;
        cursor: pointer;
        text-transform: uppercase;
        transition: 0.1s;
        white-space: nowrap;
    }
    .seq-btn:hover { background: #222; color: #fff; }
    .seq-btn.active { background: #fff; color: #000; border-color: #fff; }

    .seq-btn.v-sel[data-v="0"].active { background: var(--c-green); border-color: var(--c-green); color: #000; box-shadow: 0 0 8px rgba(0,255,68,0.5); }
    .seq-btn.v-sel[data-v="1"].active { background: var(--c-amber); border-color: var(--c-amber); color: #000; box-shadow: 0 0 8px rgba(255,157,0,0.5); }
    .seq-btn.v-sel[data-v="2"].active { background: var(--c-cyan);  border-color: var(--c-cyan);  color: #000; box-shadow: 0 0 8px rgba(0,170,255,0.5); }
    .seq-btn.v-sel[data-v="3"].active { background: var(--c-red);   border-color: var(--c-red);   color: #000; box-shadow: 0 0 8px rgba(255,68,68,0.5); }

    #btn-seq-on.active {
        background: var(--c-green);
        border-color: var(--c-green);
        color: #000;
        box-shadow: 0 0 10px rgba(0,255,68,0.45);
    }
    #btn-mod-mode.active {
        background: var(--c-red);
        border-color: var(--c-red);
        color: #000;
        box-shadow: 0 0 12px var(--c-red);
    }
    #btn-hold-mode.active {
        background: var(--c-amber);
        border-color: var(--c-amber);
        color: #000;
    }
    #btn-len { cursor: ns-resize; touch-action: none; }

    /* UNIFIED MOSAIC ALTAR + 4-LANE SCANLINE MATRIX */
    #altar-matrix-wrap {
        width: 100%;
        background: #040404;
        border: 1px solid #262626;
        padding: 5px 8px 4px 8px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 2px;
        box-shadow: inset 0 0 25px rgba(0,0,0,0.95);
    }
    .ascii-lanes {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 70px;
        border-bottom: 1px dashed #222;
        padding-bottom: 4px;
        box-sizing: border-box;
        overflow: hidden;
    }
    .ascii-lane-row {
        display: grid;
        grid-template-columns: 44px repeat(16, 1fr) 38px;
        align-items: center;
        height: 15px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        letter-spacing: 0px;
    }
    .ascii-lane-row.selected-lane {
        background: rgba(255,255,255,0.04);
    }
    .lane-left-ctrl {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-left: 3px;
    }
    .lane-tag {
        font-weight: bold;
        cursor: pointer;
        font-size: 10.5px;
        min-width: 18px;
    }
    .lane-dice {
        background: #0a0a0a;
        border: 1px solid #3a3a3a;
        color: #999;
        font-family: 'Courier New', Courier, monospace;
        font-size: 9px;
        line-height: 11px;
        padding: 1px 3px;
        cursor: pointer;
        transition: 0.1s;
    }
    .lane-dice:hover {
        color: #fff;
        border-color: #888;
        background: #222;
    }
    .lane-dice.mod-dice {
        border-color: rgba(255, 68, 68, 0.55);
        color: var(--c-red);
    }
    .lane-len-tag {
        font-size: 9.5px;
        color: #666;
        text-align: right;
        padding-right: 4px;
        cursor: ns-resize;
    }
    .ascii-cell {
        text-align: center;
        cursor: pointer;
        color: #333;
        font-weight: bold;
        height: 15px;
        line-height: 15px;
        overflow: hidden;
        user-select: none;
        touch-action: none;
    }
    .ascii-cell:nth-child(4n+2) {
        border-left: 1px solid #1c1c1c;
    }
    .ascii-cell:hover {
        color: #999;
        background: rgba(255,255,255,0.05);
    }
    .ascii-cell.out-bounds {
        opacity: 0.18;
    }
    /* Desaturated lane colors by default; slightly brighter glow when parameter-locked */
    .ascii-cell.trig-on[data-l="0"] { color: var(--c-green-dim); text-shadow: 0 0 4px rgba(82, 168, 105, 0.35); }
    .ascii-cell.trig-on[data-l="1"] { color: var(--c-amber-dim); text-shadow: 0 0 4px rgba(191, 137, 59, 0.35); }
    .ascii-cell.trig-on[data-l="2"] { color: var(--c-cyan-dim);  text-shadow: 0 0 4px rgba(73, 142, 184, 0.35); }
    .ascii-cell.trig-on[data-l="3"] { color: var(--c-red-dim);   text-shadow: 0 0 4px rgba(184, 84, 84, 0.35); }

    .ascii-cell.trig-on.has-plock[data-l="0"] { color: #75d48e; text-shadow: 0 0 6px rgba(82, 168, 105, 0.7); }
    .ascii-cell.trig-on.has-plock[data-l="1"] { color: #e0a758; text-shadow: 0 0 6px rgba(191, 137, 59, 0.7); }
    .ascii-cell.trig-on.has-plock[data-l="2"] { color: #6bb5e0; text-shadow: 0 0 6px rgba(73, 142, 184, 0.7); }
    .ascii-cell.trig-on.has-plock[data-l="3"] { color: #e07070; text-shadow: 0 0 6px rgba(184, 84, 84, 0.7); }

    .ascii-cell.playhead {
        color: #fff !important;
        background: rgba(255,255,255,0.16);
        text-shadow: 0 0 8px #fff !important;
    }
    .ascii-cell.mod-editing {
        color: #fff !important;
        background: rgba(255, 68, 68, 0.45) !important;
        box-shadow: 0 0 8px var(--c-red);
    }

    /* DEAD-CENTERED 8-BLOCK MOSAIC CANOPY WITH PER-BLOCK COLOR POLLUTION */
    #ascii-bed {
        display: grid;
        grid-template-columns: 44px repeat(8, 1fr) 38px;
        align-items: center;
        height: 74px;
        width: 100%;
        margin: 0;
        padding: 2px 0;
        overflow: hidden;
        box-sizing: border-box;
    }
    .mosaic-block {
        font-family: 'Courier New', Courier, monospace;
        font-size: 9.5px;
        line-height: 10px;
        letter-spacing: 0px;
        white-space: pre;
        margin: 0;
        padding: 0;
        text-align: center;
        color: #4f6b57;
        transition: color 0.08s ease, text-shadow 0.08s ease;
        user-select: none;
    }
</style>
</head>
<body>
<div id="chassis">
    <div class="upper-deck">
        <div class="vertical-text">MNEMOSYNE</div>
        <div class="panel-core">
            
            <!-- COLUMN 1: SYSTEM & OLED -->
            <div class="column col-sys" data-col="sys">
                <div class="col-header" id="hdr-sys">SYSTEM</div>
                <div class="oled-container">
                    <canvas id="scope" title="Click to toggle Seismograph"></canvas>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-activate">ACTIVATE</button>
                        <button class="oled-btn" id="btn-scatter">SCATTER</button>
                    </div>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-dump">DUMP</button>
                        <button class="oled-btn" id="btn-rec">REC</button>
                        <button class="oled-btn" id="btn-drift">DRIFT</button>
                    </div>
                    <div class="oled-row" style="margin-bottom: 5px;">
                        <div style="display:flex; flex: 1; align-items:center; justify-content:center; background:#111; border:1px solid #333; padding:0 2px;">
                            <button class="oled-btn" id="btn-a" style="border:none; padding:2px; min-width:15px; color:#aaa;">A</button>
                            <input type="range" id="ab-slider" min="0" max="1" step="0.001" value="0" style="width: 50px; flex: none; margin: 0 10px; height: 2px; -webkit-appearance: none; background: #555; outline: none;">
                            <button class="oled-btn" id="btn-b" style="border:none; padding:2px; min-width:15px; color:#aaa;">B</button>
                        </div>
                    </div>
                    <select id="preset-list" style="margin-bottom: 5px;"><option value="init">INITIALIZED</option></select>
                    
                    <div class="oled-row" style="margin-top: 5px;">
                        <button class="oled-btn" id="btn-mic">MIC</button>
                        <button class="oled-btn" id="btn-file">FILE</button>
                        <input type="file" id="file-upload" accept="audio/*" style="display:none;">
                    </div>
                    <button class="oled-btn freeze" id="btn-freeze" style="width:100%;">FREEZE</button>
                </div>
                
                <div class="knob-row">
                    <div class="knob-container"><div class="knob-label">FAULT</div><svg class="knob-svg" id="fault" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">SEEP</div><svg class="knob-svg" id="seep" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-group"><div class="knob-container"><div class="knob-label">ANDAMENTO</div><svg class="knob-svg" id="andamento" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            </div>

            <!-- COLUMN 2: I. PATINA -->
            <div class="column col-pat" data-col="pat">
                <div class="col-header" id="hdr-pat">I. PATINA</div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">CADENCE</div><svg class="knob-svg" id="cadence" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
                <div class="knob-row" style="margin-top: 30px;">
                    <div class="knob-container"><div class="knob-label">INDEX</div><svg class="knob-svg" id="index" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">EROSION</div><svg class="knob-svg" id="erosion" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">SILICA</div><svg class="knob-svg" id="silica" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            </div>

            <!-- COLUMN 3: II. TESSELLATION -->
            <div class="column col-tes" data-col="tes">
                <div class="col-header" id="hdr-tes">II. TESSELLATION</div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">BLOCK</div><svg class="knob-svg" id="block" data-val="0.8" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
                <div class="knob-row" style="margin-top: 30px;">
                    <div class="knob-container"><div class="knob-label">TILE</div><svg class="knob-svg" id="tile" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">FRAG</div><svg class="knob-svg" id="fragment" data-val="0.3" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">FRIT</div><svg class="knob-svg" id="frit" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            </div>

            <!-- COLUMN 4: III. DESCENT -->
            <div class="column col-des" data-col="des">
                <div class="col-header" id="hdr-des">III. DESCENT</div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">UNDERTOW</div><svg class="knob-svg" id="undertow" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
                <div class="knob-row" style="margin-top: 30px;">
                    <div class="knob-container"><div class="knob-label">CANTOR</div><svg class="knob-svg" id="cantor" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                    <div class="knob-container"><div class="knob-label">LETHE</div><svg class="knob-svg" id="lethe" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                </div>
                <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">SCATTER</div><svg class="knob-svg" id="scatter" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            </div>
        </div>
        <div class="vertical-text">SHATTER ENGINE</div>
    </div>

    <!-- SHATTER MATRIX MORPHOLOGICAL SEQUENCER SHELF -->
    <div id="seq-shelf">
        <div class="seq-bar">
            <div class="seq-section">
                <span class="seq-title">SHATTER MATRIX</span>
                <button class="seq-btn v-sel active" data-v="0" title="Lane I: Strata (Buffer Slice Index Morphology)">I. STRATA</button>
                <button class="seq-btn v-sel" data-v="1" title="Lane II: Erosion (Grain Window & Dropout Morphology)">II. EROSION</button>
                <button class="seq-btn v-sel" data-v="2" title="Lane III: Silica (Head Balance & Crystalline Grit Morphology)">III. SILICA</button>
                <button class="seq-btn v-sel" data-v="3" title="Lane IV: Lethe (Undertow & BBD Tank Send Morphology)">IV. LETHE</button>
            </div>
            <div class="seq-section">
                <button class="seq-btn active" id="btn-seq-on" title="Morphological Sequencer On/Off (Free-running when OFF)">SEQ: ON</button>
                <button class="seq-btn" id="btn-mod-mode" title="MOD OFF: Click/Drag to paint morphological states (|, =, #) | MOD ON: Lock any dial or roll random mod locks">MOD</button>
                <button class="seq-btn active" id="btn-hold-mode" title="HOLD: Morphological states & locks sustain across empty steps | REV: Revert to panel dials on empty steps">HOLD</button>
                <button class="seq-btn" id="btn-len" title="Click to cycle 16/32/48/64, Drag vertically for 1-64, or Alt-Click any step">LEN: 16</button>
                <button class="seq-btn" id="btn-view-page" title="Switch 16-step page window">PG: 1/1</button>
                <button class="seq-btn" id="btn-clr-lane" title="MOD ON: Clear locks on lane | MOD OFF: Clear all steps & locks on lane">CLR</button>
                <div style="display:flex; align-items:center; gap:5px; margin-left:4px; padding-left:8px; border-left:1px solid #333;">

                    <svg class="knob-svg" id="seq_pace" data-val="0.38" viewBox="0 0 44 44" style="width:24px; height:24px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-amber);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                    <span class="knob-label" style="margin:0 0 0 2px; color:var(--c-cyan); font-size:9px;">SUS</span>
                    <svg class="knob-svg" id="seq_sus" data-val="0.45" viewBox="0 0 44 44" style="width:24px; height:24px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-cyan);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                    <span class="knob-label" style="margin:0 0 0 2px; color:var(--c-green); font-size:9px;">GROW</span>
                    <svg class="knob-svg" id="seq_grow" data-val="0.0" viewBox="0 0 44 44" style="width:24px; height:24px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-green);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                    <span class="knob-label" style="margin:0 0 0 2px; color:var(--c-red); font-size:9px;">DRAG</span>
                    <svg class="knob-svg" id="seq_drag" data-val="0.0" viewBox="0 0 44 44" style="width:24px; height:24px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-red);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                </div>
            </div>
        </div>
        <div id="altar-matrix-wrap">
            <div class="ascii-lanes" id="ascii-lanes"></div>
            <div id="ascii-bed">
                <div></div>

                <pre class="mosaic-block" id="mb-1"></pre>
                <pre class="mosaic-block" id="mb-2"></pre>
                <pre class="mosaic-block" id="mb-3"></pre>
                <pre class="mosaic-block" id="mb-4"></pre>
                <pre class="mosaic-block" id="mb-5"></pre>
                <pre class="mosaic-block" id="mb-6"></pre>

</div>

<script>
function fitToScreen() {
    const chassis = document.getElementById('chassis');
    chassis.style.transform = 'none';
    const rect = chassis.getBoundingClientRect();
    const padding = 24;
    const scaleX = window.innerWidth / (rect.width + padding);
    const scaleY = window.innerHeight / (rect.height + padding);
    const scale = Math.min(1, scaleX, scaleY);
    chassis.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 50);

const workletString = `
class SafeDelay {
    constructor(size) { this.size = size; this.buf = new Float32Array(size); this.writeIdx = 0; }
    write(val) { if(isNaN(val)) val = 0; this.buf[this.writeIdx] = val; this.writeIdx = (this.writeIdx + 1) % this.size; }
    read(sAgo) {
        if(isNaN(sAgo)) sAgo = 0; sAgo = Math.max(0, Math.min(sAgo, this.size - 2));
        let rPos = this.writeIdx - sAgo; while(rPos < 0) rPos += this.size;
        let i1 = Math.floor(rPos); let i2 = (i1 + 1) % this.size; let frac = rPos - i1;
        return this.buf[i1] + frac * (this.buf[i2] - this.buf[i1]);
    }
}
class MnemoProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.p = {
            trace: 0, fault: 0, seep: 0, andamento: 0.5,
            cadence: 0.5, index: 0, erosion: 0, silica: 0,
            block: 0.8, tile: 0.5, fragment: 0.3, frit: 0,
            undertow: 0, cantor: 0, lethe: 0, scatter: 0,
            seq_pace: 0.38, seq_sus: 0.45, seq_grow: 0.0, seq_drag: 0.0
        };

        this.m_env = [0, 0, 0, 0];
        this.m_target = [0, 0, 0, 0];
        this.m_hold_samples = [0, 0, 0, 0];
        this.strata_shift = 0;
        this.jump_xfade = 0;
        this.prev_scan_offset = 0;

        this.port.onmessage = e => {
            if (e.data.type === 'morph_inject') {
                const l = e.data.lane;
                const level = e.data.level || 1;
                const sus = Math.max(0.05, this.p.seq_sus || 0.45);
                const pace = Math.max(0.05, this.p.seq_pace || 0.38);
                const bpm = 15.0 + pace * 165.0;
                const stepSamples = (60.0 / bpm / 4.0) * sampleRate;

                const amp = level === 3 ? 1.0 : (level === 2 ? 0.75 : 0.45);
                this.m_target[l] = amp;
                const mult = level === 1 ? (0.25 + sus * 0.6) : (0.75 + sus * 2.75);
                this.m_hold_samples[l] = Math.floor(stepSamples * mult);

                if (l === 0) {
                    // Rhythmic quarter/eighth slice offsets into the frozen buffer (no pitch glide)
                    const sliceSteps = [0.0, 0.25, 0.5, 0.75, 0.125, 0.375, 0.625, 0.875];
                    this.strata_shift = sliceSteps[e.data.stepIdx % sliceSteps.length] * (0.4 + level * 0.2);
                    this.jump_xfade = 1.0;
                }
            } else if (e.data.type === 'seq_clear_env') {
                this.m_target = [0, 0, 0, 0];
                this.m_hold_samples = [0, 0, 0, 0];
                this.strata_shift = 0;
            } else if (e.data.id && this.p[e.data.id] !== undefined) {
                if (e.data.id === 'index') this.jump_xfade = 1.0;
                this.p[e.data.id] = e.data.value;
            }
        };

        this.len = 96000;
        this.stratum = new Float32Array(this.len);
        this.rec_pos = 0;
        this.bbd = new SafeDelay(96000);
        this.bbd_hist = 0;

        this.sm = { cadence:0.5, andamento:0.5, index:0, ero:0, sil:0, seep:0, block:0.8, tile:0.5, frag:0.3, frit:0, under:0, cantor:0, lethe:0, scatter:0 };
        this.p1=0; this.p2=0; this.p3=0; this.p4=0; this.p_under=0; this.p_spin=0; this.cantor_ph_c=0; this.cantor_ph_s=0; this.eidolon_ph=0;
        this.prev_p1=0; this.prev_p2=0; this.prev_p3=0; this.prev_p4=0; this.prev_p137=0; this.prev_sr=0;

        this.fault_state = 0; this.g1=1; this.g2=1; this.g3=1; this.g4=1;
        this.dust_octave = 0; this.spin_scatter = 0; this.spin_gate = 0; this.euclid_acc = 0;
        this.glitch_L=0; this.glitch_R=0;
        this.TWOPI = Math.PI * 2;

        this.seq_ph = 0;
        this.prev_seq_ph = 0;
        this.fc = 0;
    }
    slide(t, c, u, d) { if(isNaN(c)) c=0; let diff=t-c; return c+(diff>0?diff/Math.max(1,u):diff/Math.max(1,d)); }
    noise() { return Math.random()*2-1; }
    wrap(v, min, max) { let r=max-min; if(r===0) return min; let res=(v-min)%r; if(res<0) res+=r; return res+min; }

    process(ins, outs) {
        const input = ins[0][0]; const outL = outs[0][0]; const outR = outs[0][1];
        if (!outL || !outR) return true;
        const sr = sampleRate;

        let drag = Math.max(0, Math.min(1, this.p.seq_drag));
        // When DRAG is 0, time/index parameters snap immediately (1 sample) to avoid tape-scrub pitch glides
        let time_lag = drag < 0.02 ? 1 : (1200 * drag);
        let tone_lag = drag < 0.02 ? 120 : (1800 * (0.1 + drag * 1.5));

        let pace = Math.max(0, Math.min(1, this.p.seq_pace));
        let bpm = pace > 0.01 ? (15.0 + pace * 165.0) : 0.0;
        let step_hz = (bpm / 60.0) * 4.0;

        let sus_dial = Math.max(0.05, Math.min(1, this.p.seq_sus));
        let env_attack = 120 + drag * 600;
        let env_release = 1600 + sus_dial * 12000;

        for (let i = 0; i < outL.length; i++) {
            if (step_hz > 0) {
                this.seq_ph = this.wrap(this.seq_ph + (step_hz / sr), 0.0, 1.0);
                if (this.seq_ph < this.prev_seq_ph) {
                    this.port.postMessage({ type: 'seq_tick' });
                }
                this.prev_seq_ph = this.seq_ph;
            }

            for (let m = 0; m < 4; m++) {
                if (this.m_hold_samples[m] > 0) {
                    this.m_hold_samples[m]--;
                    this.m_env[m] = this.slide(this.m_target[m], this.m_env[m], env_attack, env_release);
                } else {
                    this.m_env[m] = this.slide(0.0, this.m_env[m], env_attack, env_release);
                }
            }

            let in1 = input ? input[i] : 0;

            let mStrata  = this.m_env[0];
            let mErosion = this.m_env[1];
            let mSilica  = this.m_env[2];
            let mLethe   = this.m_env[3];

            // Calibrated morphological ranges: musical & textural, zero runaway squelch or pitch warble
            let eff_cadence = this.p.cadence;
            let eff_index   = this.wrap(this.p.index + (mStrata > 0.05 ? this.strata_shift : 0), 0, 1);
            let eff_ero     = Math.max(0, Math.min(1, this.p.erosion + mErosion * 0.45));
            let eff_seep    = Math.max(0, Math.min(1, this.p.seep + mErosion * 0.30));
            let eff_sil     = Math.max(0, Math.min(1, this.p.silica + mSilica * 0.22));
            let eff_frit    = Math.max(0, Math.min(1, this.p.frit + mSilica * 0.35));
            let eff_under   = Math.max(0, Math.min(1, this.p.undertow + mLethe * 0.45));
            let eff_lethe   = Math.max(0, Math.min(1, this.p.lethe + mLethe * 0.40));
            let eff_cantor  = Math.max(0, Math.min(1, this.p.cantor + mLethe * 0.12));

            this.sm.cadence = this.slide(eff_cadence, this.sm.cadence, time_lag, time_lag);
            this.sm.andamento = this.slide(this.p.andamento, this.sm.andamento, time_lag, time_lag);
            this.sm.index = this.slide(eff_index, this.sm.index, time_lag, time_lag);

            let sl = tone_lag;
            this.sm.ero = this.slide(eff_ero, this.sm.ero, sl, sl);
            this.sm.sil = this.slide(eff_sil, this.sm.sil, sl, sl);
            this.sm.seep = this.slide(eff_seep, this.sm.seep, sl, sl);
            this.sm.block = this.slide(this.p.block, this.sm.block, sl, sl);
            this.sm.tile = this.slide(this.p.tile, this.sm.tile, sl, sl);
            this.sm.frag = this.slide(this.p.fragment, this.sm.frag, sl, sl);
            this.sm.frit = this.slide(eff_frit, this.sm.frit, sl, sl);
            this.sm.under = this.slide(eff_under, this.sm.under, sl, sl);
            this.sm.cantor = this.slide(eff_cantor, this.sm.cantor, sl, sl);
            this.sm.lethe = this.slide(eff_lethe, this.sm.lethe, sl, sl);
            this.sm.scatter = this.slide(this.p.scatter, this.sm.scatter, sl, sl);

            let scan_offset = this.sm.index * this.len;
            if (Math.abs(scan_offset - this.prev_scan_offset) > 64) {
                this.jump_xfade = 1.0;
            }
            this.prev_scan_offset = scan_offset;
            this.jump_xfade *= 0.992; // ~3ms micro-declick envelope on abrupt slice jumps
            let declick_gain = 1.0 - (this.jump_xfade * 0.65);

            let cadence_mult = Math.pow(2, (this.sm.cadence * 2) - 1);
            let tape_speed_samples = 48000 * cadence_mult;

            if (this.p.trace === 0) {
                this.stratum[Math.floor(this.rec_pos)] = in1;
                this.rec_pos = (this.rec_pos + 1) % this.len;
            }

            let eff_fault = Math.min(1, this.p.fault + mErosion * 0.30);
            this.fault_state = eff_fault > 0.66 ? 2 : (eff_fault > 0.33 ? 1 : 0);

            let time_sec = currentTime + (i/sr);
            let drift1 = Math.sin(time_sec * 0.07 * this.TWOPI) * (this.sm.seep * 0.04);
            let drift2 = Math.sin(time_sec * 0.11 * this.TWOPI) * (this.sm.seep * 0.04);
            let drift3 = Math.sin(time_sec * 0.13 * this.TWOPI) * (this.sm.seep * 0.04);
            let drift4 = Math.sin(time_sec * 0.19 * this.TWOPI) * (this.sm.seep * 0.04);

            let m1 = 1 + drift1;
            let m2 = (this.fault_state == 1 ? 2.013 : 2) + drift2;
            let m3 = (this.fault_state == 1 ? 3.987 : 4) + drift3;
            let m4 = (this.fault_state == 1 ? 8.041 : 8) + drift4;

            let andamento_mult = Math.max(Math.pow(this.sm.andamento, 3) * 3.0, 0.001);
            let base_freq = 2.0 * andamento_mult;

            let f1 = Math.max(base_freq * m1, 0.001); let f2 = Math.max(base_freq * m2, 0.001);
            let f3 = Math.max(base_freq * m3, 0.001); let f4 = Math.max(base_freq * m4, 0.001);

            this.p1 = this.wrap(this.p1 + f1/sr, 0, 1); let dp1 = this.p1 - this.prev_p1; this.prev_p1 = this.p1;
            this.p2 = this.wrap(this.p2 + f2/sr, 0, 1); let dp2 = this.p2 - this.prev_p2; this.prev_p2 = this.p2;
            this.p3 = this.wrap(this.p3 + f3/sr, 0, 1); let dp3 = this.p3 - this.prev_p3; this.prev_p3 = this.p3;
            this.p4 = this.wrap(this.p4 + f4/sr, 0, 1); let dp4 = this.p4 - this.prev_p4; this.prev_p4 = this.p4;

            if (this.fault_state == 2) {
                if(dp1 < -0.5) this.g1 = this.noise() > -0.2 ? 1 : 0;
                if(dp2 < -0.5) this.g2 = this.noise() > 0.2 ? 1 : 0;
                if(dp3 < -0.5) this.g3 = this.noise() > 0.5 ? 1 : 0;
                if(dp4 < -0.5) this.g4 = this.noise() > 0.7 ? 1 : 0;
            } else { this.g1=1; this.g2=1; this.g3=1; this.g4=1; }

            let win1 = (this.p1 < 0.5 ? 1 : 0) * (1 - this.sm.ero) + Math.sin(this.p1 * Math.PI) * this.sm.ero * this.g1;
            let win2 = (this.p2 < 0.5 ? 1 : 0) * (1 - this.sm.ero) + Math.sin(this.p2 * Math.PI) * this.sm.ero * this.g2;
            let win3 = (this.p3 < 0.5 ? 1 : 0) * (1 - this.sm.ero) + Math.sin(this.p3 * Math.PI) * this.sm.ero * this.g3;
            let win4 = (this.p4 < 0.5 ? 1 : 0) * (1 - this.sm.ero) + Math.sin(this.p4 * Math.PI) * this.sm.ero * this.g4;

            let ws1 = Math.max(1, Math.min(this.len, tape_speed_samples / f1));
            let ws2 = Math.max(1, Math.min(this.len, tape_speed_samples / f2));
            let ws3 = Math.max(1, Math.min(this.len, tape_speed_samples / f3));
            let ws4 = Math.max(1, Math.min(this.len, tape_speed_samples / f4));

            let chunk = this.len / 4;
            let idx1 = ((this.p1 * ws1) + scan_offset) % this.len;
            let idx2 = ((this.p2 * ws2) + chunk + scan_offset) % this.len;
            let idx3 = ((this.p3 * ws3) + (chunk * 2) + scan_offset) % this.len;
            let idx4 = ((this.p4 * ws4) + (chunk * 3) + scan_offset) % this.len;

            let v1 = this.stratum[Math.floor(idx1)] * win1 * Math.min(1.15, this.sm.block + mStrata * 0.15) * declick_gain;
            let v2 = this.stratum[Math.floor(idx2)] * win2 * Math.min(1.15, this.sm.tile  + mErosion * 0.20) * declick_gain;

            let seep_choke = Math.max(0, Math.min(1, (this.sm.seep - 0.5) * 2.0));
            let choke_win3 = 1.0 * (1 - seep_choke) + (1.0 - win1) * seep_choke;
            let choke_win4 = 1.0 * (1 - seep_choke) + (1.0 - win2) * seep_choke;

            let v3 = this.stratum[Math.floor(idx3)] * win3 * Math.min(1.15, this.sm.frag + mSilica * 0.22) * choke_win3 * declick_gain;
            let v4 = this.stratum[Math.floor(idx4)] * win4 * Math.min(1.15, this.sm.frit + mLethe * 0.20) * choke_win4 * declick_gain;

            let mosaic_core = v1 + v2 + v3 + v4;

            let seep_stutter = Math.max(0, Math.min(1, (this.sm.seep - 0.75) * 4.0));
            if(dp2 < -0.5) this.stutter_gate = this.noise() > 0.1 ? 1 : 0;
            let dry_mosaic = mosaic_core * (1.0 * (1 - seep_stutter) + (this.stutter_gate||0) * seep_stutter);

            this.p_under = this.wrap(this.p_under + (cadence_mult * 1.0)/sr, 0, 1);
            let idx_under = (this.len - (this.p_under * this.len) + scan_offset) % this.len;
            let v_under = this.stratum[Math.floor(idx_under)] * Math.sin(this.p_under * Math.PI) * this.sm.under;

            let p137 = this.wrap(time_sec * cadence_mult * 13.7, 0, 1);
            let dp137 = p137 - this.prev_p137; this.prev_p137 = p137;
            if(dp137 < -0.5) {
                this.dust_octave = Math.floor(Math.abs(this.noise()) * 3);
                this.spin_scatter = Math.abs(this.noise()) * this.len;
                this.spin_gate = this.noise() > 0.3 ? 1 : 0;
            }
            let dust_mult = Math.pow(2, this.dust_octave);
            let dust_speed = (cadence_mult * 13.7) * dust_mult;

            this.p_spin = this.wrap(this.p_spin + dust_speed/sr, 0, 1);
            let ws_spin = Math.max(1, Math.min(this.len, tape_speed_samples / dust_speed));
            let idx_spin = ((this.p_spin * ws_spin) + this.spin_scatter + scan_offset) % this.len;

            if(dp3 < -0.5) this.euclid_acc++;
            let is_euclid = ((this.euclid_acc % 16) * 5) % 16 < 5 ? 1 : 0;
            let idx_euclid = ((this.p3 * ws3) + scan_offset) % this.len;

            let lock_act = this.sm.scatter > 0.95 ? 1 : 0;
            let final_sc_gate = this.spin_gate * (1-lock_act) + is_euclid * lock_act;
            let final_sc_idx = idx_spin * (1-lock_act) + idx_euclid * lock_act;
            let final_sc_win = (Math.sin(this.p_spin*Math.PI)*(1-lock_act) + Math.sin(this.p3*Math.PI)*lock_act) * final_sc_gate;

            let v_scatter = this.stratum[Math.floor(final_sc_idx)] * final_sc_win * this.sm.scatter;

            let raw_L = dry_mosaic + v_under;
            let raw_R = dry_mosaic + v_scatter;

            let sr_rate = Math.max(100, 48000 - (this.sm.sil * 47500));
            let p_sr = this.wrap(time_sec * sr_rate, 0, 1);
            if (p_sr < this.prev_sr) { this.glitch_L = raw_L; this.glitch_R = raw_R; }
            this.prev_sr = p_sr;

            let foldL = raw_L; let foldR = raw_R;
            if(this.sm.sil > 0.01) {
                let fvL = this.glitch_L * (1 + this.sm.sil * 4);
                foldL = Math.abs((fvL + 1) % 4 - 2) - 1;
                let fvR = this.glitch_R * (1 + this.sm.sil * 4);
                foldR = Math.abs((fvR + 1) % 4 - 2) - 1;
            }

            let cantor_act = this.sm.cantor > 0.01 ? 1 : 0;
            let base_cantor_freq = 40 + Math.pow(this.sm.cantor, 1.5) * 280;

            let seep_bend = Math.max(0, Math.min(1, (this.sm.seep - 0.75) * 4.0));
            let mica_c = Math.sin(time_sec * 0.040 * this.TWOPI);
            let mica_s = Math.sin(time_sec * 0.047 * this.TWOPI);

            let pm_c = 1.0 + (mica_c * 0.03 * seep_bend);
            let pm_s = 1.0 + (mica_s * 0.03 * seep_bend);
            let c_drift = Math.sin(time_sec * 0.15 * this.TWOPI) * 0.005;
            let c_melt = (foldL + foldR) * 0.1;

            this.cantor_ph_c = this.wrap(this.cantor_ph_c + (base_cantor_freq * pm_c * (1+c_drift))/sr, 0, 1);
            this.cantor_ph_s = this.wrap(this.cantor_ph_s + ((base_cantor_freq*0.5) * pm_s * (1+c_drift))/sr, 0, 1);

            let c_core = Math.sin((this.cantor_ph_c + c_melt) * this.TWOPI);
            let c_sub = Math.sin((this.cantor_ph_s + c_melt) * this.TWOPI) * this.sm.seep;

            let c_pre = (c_core + c_sub) * 1.5;
            let c_fold = Math.abs((c_pre + 1) % 4 - 2) - 1;
            let cantor_sig = c_fold * this.sm.cantor * cantor_act * 0.25;

            let e_gate = Math.max(0, Math.min(1, (this.sm.seep - 0.7) * 3.3));
            this.eidolon_ph = this.wrap(this.eidolon_ph + ((base_cantor_freq * 4.0) * (1.0 + mica_c*0.05))/sr, 0, 1);
            let e_core = Math.sin((this.eidolon_ph + c_melt) * this.TWOPI);
            let eidolon_sig = e_core * Math.abs(mosaic_core) * e_gate * this.sm.cantor * 0.3;

            let tank1 = 11300 + (Math.sin(time_sec * 0.11 * this.TWOPI) * 50);
            let tank2 = 17900 + (Math.cos(time_sec * 0.17 * this.TWOPI) * 70);

            let tap1 = this.bbd.read(tank1); let tap2 = this.bbd.read(tank2);

// --- 4-LANE MORPHOLOGICAL SEQUENCER (PERSISTENT DOM NODES - ZERO JITTER) ---
const asciiLanesContainer = document.getElementById('ascii-lanes');
const lenBtn = document.getElementById('btn-len');
const pageBtn = document.getElementById('btn-view-page');

const laneRowEls = [];
const laneDiceEls = [];
const laneLenEls = [];
const cellEls = Array.from({ length: 4 }, () => new Array(16));

function initAsciiLanesDOM() {
    asciiLanesContainer.innerHTML = '';
    for (let l = 0; l < 4; l++) {
        const row = document.createElement('div');
        row.className = 'ascii-lane-row';
        laneRowEls.push(row);

        const leftCtrl = document.createElement('div');
        leftCtrl.className = 'lane-left-ctrl';

        const tag = document.createElement('div');
        tag.className = 'lane-tag';
        tag.style.color = laneColors[l];
        tag.textContent = laneLabels[l];
        tag.title = `Select Lane ${laneLabels[l]}`;
        tag.addEventListener('click', () => selectLane(l));

        const diceBtn = document.createElement('button');
        diceBtn.className = 'lane-dice';
        diceBtn.textContent = '⚄';
        diceBtn.addEventListener('click', e => {
            e.stopPropagation();
            rollLaneDice(l);
        });
        laneDiceEls.push(diceBtn);

        leftCtrl.appendChild(tag);
        leftCtrl.appendChild(diceBtn);
        row.appendChild(leftCtrl);

        for (let i = 0; i < 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'ascii-cell';
            cell.dataset.l = l;

            cell.addEventListener('pointerdown', e => {
                const stepIdx = viewPage * 16 + i;
                const stepObj = seqTracks[l][stepIdx];

                if (activeTrack !== l) {
                    activeTrack = l;
                    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === l));
                    updateLenUI();
                }
                if (e.altKey) {
                    laneLengths[l] = stepIdx + 1;
                    if (playSteps[l] >= laneLengths[l]) playSteps[l] = 0;
                    updateLenUI();
                    renderAsciiLanes();
                    return;
                }

                if (!modMode) {
                    isSeqDragging = true;
                    dragStartStep = stepIdx;
                    dragLane = l;
                    dragMoved = false;
                } else {
                    if (editingStep === stepIdx) {
                        stepObj.locks = {};
                        syncKnobsToEditState();
                    } else {
                        if (!stepObj.trig) { stepObj.trig = true; stepObj.level = 1; }
                        editingStep = stepIdx;
                        syncKnobsToEditState();
                    }
                    renderAsciiLanes();
                }
            });

            cell.addEventListener('pointerenter', () => {
                const stepIdx = viewPage * 16 + i;
                if (!isSeqDragging || dragLane !== l || modMode) return;
                if (stepIdx !== dragStartStep) {
                    dragMoved = true;
                    seqTracks[l][dragStartStep].trig = true;
                    seqTracks[l][dragStartStep].isHeld = true;
                    seqTracks[l][dragStartStep].level = 2;

                    seqTracks[l][stepIdx].trig = true;
                    seqTracks[l][stepIdx].isHeld = true;
                    seqTracks[l][stepIdx].level = 2;
                    renderAsciiLanes();
                }
            });

            cellEls[l][i] = cell;
            row.appendChild(cell);
        }

        const lenTag = document.createElement('div');
        lenTag.className = 'lane-len-tag';
        lenTag.title = 'Click to select lane';
        lenTag.addEventListener('click', () => selectLane(l));
        laneLenEls.push(lenTag);

    }

function updateLenUI() {
    let l = laneLengths[activeTrack];
    lenBtn.textContent = `LEN: ${l}`;
    let maxPages = Math.max(1, Math.ceil(l / 16));
    if (viewPage >= maxPages) viewPage = maxPages - 1;
    pageBtn.textContent = `PG: ${viewPage + 1}/${maxPages}`;
}

function selectLane(v) {
    activeTrack = v;
    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === v));
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    updateLenUI();
    syncKnobsToEditState();
    renderAsciiLanes();
}

function syncKnobsToEditState() {
    document.querySelectorAll('.knob-svg').forEach(k => {
        if (seqUtilKnobs.includes(k.id)) return;
        k.classList.remove('plocked');
        if (modMode && editingStep !== null) {
            const locks = seqTracks[activeTrack][editingStep].locks;
            if (locks[k.id] !== undefined) {
                k.classList.add('plocked');
            }
        }
    });
}

function rollLaneDice(l) {
    selectLane(l);
    const len = laneLengths[l];
    if (!modMode) {
        for (let s = 0; s < len; s++) {
            seqTracks[l][s].locks = {};
            const r = Math.random();
            if (r < 0.42) {
                seqTracks[l][s].trig = true;
                if (r < 0.16) {
                    seqTracks[l][s].isHeld = true;
                    seqTracks[l][s].level = 3; // Saturated (#)
                } else if (r < 0.30) {
                    seqTracks[l][s].isHeld = true;
                    seqTracks[l][s].level = 2; // Held (=)
                } else {
                    seqTracks[l][s].isHeld = false;
                    seqTracks[l][s].level = 1; // Hit (|)
                }
            } else {
                seqTracks[l][s].trig = false;
                seqTracks[l][s].isHeld = false;
                seqTracks[l][s].level = 0;
            }
        }
    } else {
        let hasAny = false;
        for (let s = 0; s < len; s++) if (seqTracks[l][s].trig) hasAny = true;
        if (!hasAny) {
            for (let s = 0; s < len; s++) {
                if (Math.random() < 0.35) {
                    seqTracks[l][s].trig = true;
                    seqTracks[l][s].isHeld = Math.random() < 0.5;
                    seqTracks[l][s].level = seqTracks[l][s].isHeld ? 2 : 1;
                }
            }
        }
        const pool = laneParamPools[l];
        for (let s = 0; s < len; s++) {
            if (seqTracks[l][s].trig) {
                seqTracks[l][s].locks = {};
                for (let p of pool) {
                    if (Math.random() < 0.65) {
                        // Keep silica and cantor locks restrained during random MOD rolls
                        let maxCap = (p === 'silica') ? 0.35 : (p === 'cantor' ? 0.30 : 0.90);
                        seqTracks[l][s].locks[p] = Math.max(0.05, Math.min(maxCap, Math.random() * maxCap));
                    }
                }
            }
        }
        syncKnobsToEditState();
    }
    renderAsciiLanes();
}

function evolveLaneOnCycle(l) {
    const grow = baseParams['seq_grow'] || 0;
    if (grow < 0.02) return;
    const len = laneLengths[l];
    const nextState = seqTracks[l].map(st => ({
        trig: st.trig,
        isHeld: st.isHeld,
        level: st.level,
        locks: { ...st.locks }
    }));

    for (let s = 0; s < len; s++) {
        if (Math.random() > grow * 0.65) continue;

        const cur = seqTracks[l][s];
        const prevIdx = (s - 1 + len) % len;
        const nextIdx = (s + 1) % len;

        if (cur.trig) {
            const action = Math.random();
            if (action < 0.35) {
                let newLvl = cur.level + (Math.random() < 0.55 ? 1 : -1);
                if (newLvl <= 0) {
                    if (grow > 0.45) {
                        nextState[s].trig = false;
                        nextState[s].isHeld = false;
                        nextState[s].level = 0;
                    } else {
                        nextState[s].level = 1;
                        nextState[s].isHeld = false;
                    }
                } else {
                    nextState[s].level = Math.min(3, newLvl);
                    nextState[s].isHeld = nextState[s].level >= 2;
                }
            } else if (action < 0.75) {
                const target = Math.random() < 0.5 ? nextIdx : prevIdx;
                if (!nextState[target].trig) {
                    nextState[target].trig = true;
                    nextState[target].level = Math.max(1, cur.level - 1);
                    nextState[target].isHeld = nextState[target].level >= 2;
                    for (let k in cur.locks) {
                        let drifted = cur.locks[k] + (Math.random() - 0.5) * 0.14 * grow;
                        nextState[target].locks[k] = Math.max(0, Math.min(1, drifted));
                    }
                }
            }
            for (let k in nextState[s].locks) {
                let d = nextState[s].locks[k] + (Math.random() - 0.5) * 0.1 * grow;
                nextState[s].locks[k] = Math.max(0, Math.min(1, d));
            }
        } else if (grow > 0.3 && Math.random() < grow * 0.22) {
            nextState[s].trig = true;
            nextState[s].level = Math.random() < grow ? 2 : 1;
            nextState[s].isHeld = nextState[s].level >= 2;
            if (grow > 0.6 && Math.random() < 0.5) {
                const pool = laneParamPools[l];
                const p = pool[Math.floor(Math.random() * pool.length)];
                nextState[s].locks[p] = Math.random() * 0.7;
            }
        }
    }

    for (let s = 0; s < len; s++) {
        seqTracks[l][s] = nextState[s];
    }
}

function renderAsciiLanes() {
    const offset = viewPage * 16;

    for (let l = 0; l < 4; l++) {
        laneRowEls[l].classList.toggle('selected-lane', l === activeTrack);
        laneDiceEls[l].classList.toggle('mod-dice', modMode);
        laneDiceEls[l].title = modMode
            ? `Roll random MOD parameter locks for Lane ${laneLabels[l]}`
            : `Wipe & roll random morphological steps for Lane ${laneLabels[l]}`;

        const activeLen = laneLengths[l];
        laneLenEls[l].textContent = `/${ String(activeLen).padStart(2, '0') }`;

        for (let i = 0; i < 16; i++) {
            const stepIdx = offset + i;
            const stepObj = seqTracks[l][stepIdx];
            const cell = cellEls[l][i];

            const hasLocks = Object.keys(stepObj.locks).length > 0;
            const isPlayhead = isPlaying && seqOn && playSteps[l] === stepIdx;
            const isEditing = modMode && l === activeTrack && editingStep === stepIdx;

            cell.classList.toggle('out-bounds', stepIdx >= activeLen);
            cell.classList.toggle('trig-on', stepObj.trig);
            cell.classList.toggle('has-plock', hasLocks);
            cell.classList.toggle('playhead', isPlayhead);
            cell.classList.toggle('mod-editing', isEditing);

            let sym = ' · ';
            if (isEditing) {
                sym = '[#]';
            } else if (isPlayhead) {
                if (stepObj.trig) {
                    sym = stepObj.level === 3 ? '[#]' : (stepObj.isHeld ? '[=]' : '[|]');
                } else {
                    sym = ' ┃ ';
                }
            } else if (stepObj.trig) {
                if (stepObj.level === 3) sym = hasLocks ? '‡#‡' : ' # ';
                else if (stepObj.isHeld) sym = hasLocks ? '‡=‡' : ' = ';
                else sym = hasLocks ? ' ‡ ' : ' | ';
            }
            if (cell.textContent !== sym) {
                cell.textContent = sym;
            }
        }
    }
}

window.addEventListener('pointerup', () => {
    if (!isSeqDragging) return;
    const l = dragLane;
    const s = dragStartStep;
    const wasDrag = dragMoved;
    isSeqDragging = false;
    dragMoved = false;

    if (!wasDrag && l !== null && s !== null && !modMode) {
        const st = seqTracks[l][s];
        if (!st.trig) {
            st.trig = true;
            st.isHeld = false;
            st.level = 1; // Hit (|)
            if (mnemoNode) mnemoNode.port.postMessage({ type: 'morph_inject', lane: l, level: 1, stepIdx: s % 16 });
        } else if (!st.isHeld) {
            st.isHeld = true;
            st.level = 2; // Hold (=)
            if (mnemoNode) mnemoNode.port.postMessage({ type: 'morph_inject', lane: l, level: 2, stepIdx: s % 16 });
        } else {
            st.trig = false;
            st.isHeld = false;
            st.level = 0;
            st.locks = {};
        }
        editingStep = null;
        renderAsciiLanes();
    }
});

initAsciiLanesDOM();
updateLenUI();
renderAsciiLanes();

document.querySelectorAll('.v-sel').forEach(btn => {
    btn.addEventListener('click', e => {
        selectLane(parseInt(e.target.dataset.v));
    });
});

document.getElementById('btn-seq-on').addEventListener('click', e => {
    seqOn = !seqOn;
    e.target.classList.toggle('active', seqOn);
    e.target.textContent = seqOn ? 'SEQ: ON' : 'SEQ: OFF';
    if (!seqOn) {
        if (mnemoNode) mnemoNode.port.postMessage({ type: 'seq_clear_env' });
        for (let pId of allSynthParams) {
            applyTargetParam(pId, baseParams[pId], false);
        }
    }
    renderAsciiLanes();
});

document.getElementById('btn-mod-mode').addEventListener('click', e => {
    modMode = !modMode;
    e.target.classList.toggle('active', modMode);
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    syncKnobsToEditState();
    renderAsciiLanes();
});

document.getElementById('btn-hold-mode').addEventListener('click', e => {
    holdMode = !holdMode;
    e.target.classList.toggle('active', holdMode);
});

let lenDragging = false, lenStartY = 0, lenStartVal = 16, lenMoved = false;
lenBtn.addEventListener('pointerdown', e => {
    lenDragging = true; lenMoved = false; lenStartY = e.clientY; lenStartVal = laneLengths[activeTrack];
    lenBtn.setPointerCapture(e.pointerId); e.preventDefault();
});
window.addEventListener('pointermove', e => {
    if (!lenDragging) return;
    let dy = lenStartY - e.clientY;
    if (Math.abs(dy) > 4) {
        lenMoved = true;
        let newLen = Math.max(1, Math.min(64, Math.round(lenStartVal + dy * 0.25)));
        laneLengths[activeTrack] = newLen;
        if (playSteps[activeTrack] >= newLen) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});
window.addEventListener('pointerup', e => {
    if (!lenDragging) return;
    lenDragging = false;
    try { lenBtn.releasePointerCapture(e.pointerId); } catch(err){}
    if (!lenMoved) {
        let cur = laneLengths[activeTrack];
        laneLengths[activeTrack] = cur < 16 ? 16 : (cur < 32 ? 32 : (cur < 48 ? 48 : (cur < 64 ? 64 : 16)));
        if (playSteps[activeTrack] >= laneLengths[activeTrack]) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});

pageBtn.addEventListener('click', () => {
    let maxPages = Math.max(1, Math.ceil(laneLengths[activeTrack] / 16));
    viewPage = (viewPage + 1) % maxPages;
    updateLenUI();
    renderAsciiLanes();
});

document.getElementById('btn-clr-lane').addEventListener('click', () => {
    for (let s = 0; s < 64; s++) {
        seqTracks[activeTrack][s].locks = {};
        if (!modMode) {
            seqTracks[activeTrack][s].trig = false;
            seqTracks[activeTrack][s].isHeld = false;
            seqTracks[activeTrack][s].level = 0;
        }
    }
    editingStep = null;
    syncKnobsToEditState();
    renderAsciiLanes();
});

function applyTargetParam(kId, targetVal, isLocked) {
    liveParams[kId] = targetVal;
    sendParam(kId, targetVal);
    if (!modMode || editingStep === null) {
        const knobEl = document.getElementById(kId);
        if (knobEl) {
            setKnobVisual(knobEl, targetVal);
            knobEl.classList.toggle('mod-active', isLocked);
        }
    }
}

function advanceSequencer() {
    if (!seqOn) return;
    let combinedLocks = {};

    for (let l = 0; l < 4; l++) {
        let nextStep = (playSteps[l] + 1) % laneLengths[l];
        if (nextStep === 0 && playSteps[l] >= 0) {
            evolveLaneOnCycle(l);
        }
        playSteps[l] = nextStep;
        const stepObj = seqTracks[l][playSteps[l]];

        if (stepObj.trig) {
            if (mnemoNode) {
                mnemoNode.port.postMessage({
                    type: 'morph_inject',
                    lane: l,
                    level: stepObj.level || (stepObj.isHeld ? 2 : 1),
                    stepIdx: playSteps[l] % 16
                });
            }
            for (let kId in stepObj.locks) {
                combinedLocks[kId] = stepObj.locks[kId];
            }
        }
    }

    for (let kId in combinedLocks) {
        applyTargetParam(kId, combinedLocks[kId], true);
    }

    if (!holdMode) {
        for (let pId of allSynthParams) {
            if (combinedLocks[pId] === undefined) {
                applyTargetParam(pId, baseParams[pId], false);
            }
        }
    }

    renderAsciiLanes();
}

// --- 8-BLOCK MOSAIC CANOPY WITH COLOUR POLLUTION & STRUCTURAL MORPHING ---
const mosaicBlockEls = Array.from({ length: 8 }, (_, i) => document.getElementById(`mb-${i}`));
const laneRGB = [
    [82, 168, 105],  // Lane I: Desaturated Green
    [191, 137, 59],  // Lane II: Desaturated Amber
    [73, 142, 184],  // Lane III: Desaturated Cyan
    [184, 84, 84]    // Lane IV: Desaturated Red
];
const blockPollutionRGB = Array.from({ length: 8 }, () => [72, 105, 84]);
const blockPollutionEnergy = new Float32Array(8);
let mosaicPhase = 0;

function renderAsciiMosaic() {
    const eros = liveParams['erosion'] || 0;
    const sil = liveParams['silica'] || 0;
    const fault = liveParams['fault'] || 0;
    const under = liveParams['undertow'] || 0;

    const chaos = Math.min(1.0, Math.max(0.0, eros * 0.5 + sil * 0.3 + fault * 0.2 + liveShatterAct * 0.6));
    mosaicPhase += 0.16 + chaos * 0.35;

    const offset = viewPage * 16;
    const bw = 11;
    const bh = 7;

    for (let b = 0; b < 8; b++) {
        const bGrid = Array.from({ length: bh }, () => new Array(bw).fill(' '));
        const stepA = offset + b * 2;
        const stepB = offset + b * 2 + 1;

        const laneEnergies = [0, 0, 0, 0];
        let dominantLane = -1;
        let maxLevel = 0;

        // Top 2 rows (0 & 1): Conduit injection streams for stepA (col 2) and stepB (col 8)
        for (let sub = 0; sub < 2; sub++) {
            const stIdx = sub === 0 ? stepA : stepB;
            const cx = sub === 0 ? 2 : 8;
            let colLevel = 0;
            let colHasLock = false;
            let colPlayhead = false;

            for (let l = 0; l < 4; l++) {
                const st = seqTracks[l][stIdx];
                const isPH = isPlaying && seqOn && playSteps[l] === stIdx;
                if (isPH) colPlayhead = true;

                if (st && st.trig) {
                    const lvl = st.level || 1;
                    colLevel = Math.max(colLevel, lvl);
                    if (Object.keys(st.locks).length > 0) colHasLock = true;
                    const weight = isPH ? (lvl * 1.35) : (lvl * 0.22);
                    laneEnergies[l] += weight;
                    if (weight > maxLevel) {
                        maxLevel = weight;
                        dominantLane = l;
                    }
                }
            }

            if (colPlayhead) {
                bGrid[0][cx] = '┃';
                bGrid[1][cx] = colLevel > 0 ? '▼' : '╵';
            } else if (colLevel > 0) {
                bGrid[0][cx] = colHasLock ? '‡' : (colLevel >= 2 ? '|' : ':');
                bGrid[1][cx] = colLevel >= 2 ? 'v' : '·';
            }
        }

        // Compute blended target RGB from active lanes polluting this block
        const totalEnergy = laneEnergies[0] + laneEnergies[1] + laneEnergies[2] + laneEnergies[3];
        let targetR = 68, targetG = 98, targetB = 82;
        if (totalEnergy > 0.01) {
            targetR = 0; targetG = 0; targetB = 0;
            for (let l = 0; l < 4; l++) {
                const w = laneEnergies[l] / totalEnergy;
                targetR += laneRGB[l][0] * w;
                targetG += laneRGB[l][1] * w;
                targetB += laneRGB[l][2] * w;
            }
            blockPollutionEnergy[b] = Math.min(1.0, blockPollutionEnergy[b] * 0.75 + totalEnergy * 0.28);
        } else {
            blockPollutionEnergy[b] *= 0.88;
        }

        // Smoothly interpolate block colour pollution
        blockPollutionRGB[b][0] += (targetR - blockPollutionRGB[b][0]) * 0.25;
        blockPollutionRGB[b][1] += (targetG - blockPollutionRGB[b][1]) * 0.25;
        blockPollutionRGB[b][2] += (targetB - blockPollutionRGB[b][2]) * 0.25;

        const rCol = Math.round(blockPollutionRGB[b][0]);
        const gCol = Math.round(blockPollutionRGB[b][1]);
        const bCol = Math.round(blockPollutionRGB[b][2]);
        const glowAmt = Math.min(1, blockPollutionEnergy[b] + chaos * 0.4);

        const el = mosaicBlockEls[b];
        el.style.color = `rgb(${rCol}, ${gCol}, ${bCol})`;
        el.style.textShadow = glowAmt > 0.15
            ? `0 0 ${Math.round(3 + glowAmt * 7)}px rgba(${rCol}, ${gCol}, ${bCol}, ${0.35 + glowAmt * 0.35})`
            : 'none';

        // Rows 2 to 6: Render the mosaic block geometry, structurally morphing when polluted
        const isMorphing = totalEnergy > 0.35 || chaos > 0.25 || liveHeads[b % 4] > 0.2;

        for (let r = 2; r <= 5; r++) {
            for (let w = 0; w < bw; w++) {
                const isBorderR = (r === 2 || r === 5);
                const isBorderW = (w === 0 || w === bw - 1);

                if (!isMorphing) {
                    if (isBorderR) bGrid[r][w] = isBorderW ? '+' : '-';
                    else bGrid[r][w] = isBorderW ? '|' : (w % 2 === 0 ? '#' : '=');
                } else {
                    if (dominantLane === 0) {
                        const shift = (r % 2 === 0) ? 1 : -1;
                        const sw = (w + shift + bw) % bw;
                        if (isBorderR) bGrid[r][sw] = isBorderW ? '>' : '=';
                        else bGrid[r][sw] = (w % 3 === 0) ? '»' : '#';
                    } else if (dominantLane === 1) {
                        const eroChars = "·:~. ";
                        const idx = Math.abs(Math.floor(Math.sin(mosaicPhase + w * 0.7 + r) * eroChars.length));
                        bGrid[r][w] = isBorderR ? (w % 2 === 0 ? '·' : ':') : eroChars[idx % eroChars.length];
                    } else if (dominantLane === 2) {
                        const silChars = "/\\◊x*+";
                        const idx = Math.abs(Math.floor(Math.cos(mosaicPhase * 1.5 + w + r) * silChars.length));
                        bGrid[r][w] = silChars[idx % silChars.length];
                    } else if (dominantLane === 3) {
                        if (r === 2) bGrid[r][w] = isBorderW ? '┬' : '~';
                        else if (r === 5) bGrid[r][w] = (w % 2 === 0) ? '⋮' : '╷';
                        else bGrid[r][w] = (w % 2 === 0) ? '│' : '⋮';
                        if (w % 3 === 1) bGrid[6][w] = '╷';
                    } else {
                        const shardChars = ".:;~=*+#%@\\/x+";
                        const idx = Math.abs(Math.floor(Math.sin(mosaicPhase * 2 + w + r + b) * shardChars.length));
                        bGrid[r][w] = shardChars[idx % shardChars.length];
                    }
                }
            }
        }

        el.textContent = bGrid.map(row => row.join('')).join('\n');
    }
}

setInterval(renderAsciiMosaic, 60);
renderAsciiMosaic();
