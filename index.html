<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNEMOSYNE - Shatter Engine</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap');
    :root {
        --bg: #0c0c0c; --panel: #111111; --border-main: #ffffff; --col-div: rgba(255, 255, 255, 0.25);
        --c-green: #00ff44; --c-amber: #ff9d00; --c-cyan: #00aaff; --c-red: #ff4444;
        --text-dim: #bbbbbb;
    }
    body, #chassis, .column, .oled-container, .knob-container, #seq-shelf {
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { background-color: var(--bg); color: #fff; font-family: 'Oswald', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    #chassis { display: flex; flex-direction: column; background-color: var(--panel); border: 2px solid var(--border-main); outline: 2px solid var(--border-main); outline-offset: -8px; padding: 10px; box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8); transform-origin: center center; }
    .upper-deck { display: flex; flex-direction: row; width: 100%; }
    .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 14px; font-weight: 500; letter-spacing: 6px; padding: 0 15px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
    .panel-core { display: flex; border-left: 1px solid var(--col-div); border-right: 1px solid var(--col-div); padding: 15px 0; }
    
    .column { width: 155px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--col-div); padding: 0 5px; position: relative; }
    .column:last-child { border-right: none; }
    .col-header { font-size: 14px; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; color: var(--text-dim); height: 20px; text-align: center; transition: color 0.3s ease, text-shadow 0.3s ease; }
    
    .oled-container { width: 140px; background: #000; border: 1px solid #333; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; padding: 5px; box-sizing: border-box; box-shadow: inset 0 0 10px rgba(255,255,255,0.05); }
    #scope { width: 100%; height: 40px; background: #050505; margin-bottom: 6px; border: 1px solid #222; cursor: pointer; }
    .oled-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 5px; gap: 2px; }
    .oled-btn { flex: 1; background: transparent; border: 1px solid #555; color: #fff; font-family: 'Oswald', sans-serif; font-size: 9px; padding: 3px 0; cursor: pointer; text-transform: uppercase; transition: 0.1s; text-align: center; }
    .oled-btn:hover { background: #333; }
    .oled-btn.active { background: var(--border-main); color: #000; }
    .oled-btn.freeze { background: #111; border-color: var(--c-cyan); color: var(--c-cyan); font-weight: bold; font-size: 11px; padding: 5px 0; letter-spacing: 1px; }
    .oled-btn.freeze.active { background: var(--c-cyan); color: #000; box-shadow: 0 0 10px var(--c-cyan); }
    
    #ab-slider::-webkit-slider-thumb { appearance: none; width: 8px; height: 12px; background: #fff; cursor: pointer; }
    #preset-list { width: 100%; background: #000; color: var(--border-main); border: 1px solid #555; font-family: 'Oswald', sans-serif; font-size: 10px; outline: none; padding: 2px; }
    
    .knob-group { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; width: 100%; }
    .knob-row { display: flex; justify-content: space-evenly; width: 100%; margin-bottom: 20px; }
    .knob-container { display: flex; flex-direction: column; align-items: center; position: relative; }
    .knob-label { font-size: 10px; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .knob-svg { width: 44px; height: 44px; cursor: ns-resize; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); touch-action: none; }
    .knob-bg { fill: #1c1c1c; stroke-width: 2.5px; }
    .knob-indicator { stroke: #fff; stroke-width: 2.5px; stroke-linecap: round; }
    .knob-svg.plocked .knob-indicator { stroke: var(--c-red); stroke-width: 3.5px; }
    .knob-svg.mod-active .knob-indicator { stroke: var(--c-amber); }
    
    .col-sys .knob-bg { stroke: var(--c-green); } .col-sys .knob-label { color: var(--c-green); }
    .col-pat .knob-bg { stroke: var(--c-amber); } .col-pat .knob-label { color: var(--c-amber); }
    .col-tes .knob-bg { stroke: var(--c-cyan); }  .col-tes .knob-label { color: var(--c-cyan); }
    .col-des .knob-bg { stroke: var(--c-red); }   .col-des .knob-label { color: var(--c-red); }

    /* SHATTER MATRIX SCANLINE SEQUENCER & MOSAIC ALTAR SHELF */
    #seq-shelf {
        border-top: 1px solid var(--col-div);
        margin: 0 6px;
        padding: 10px 12px 6px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(0,0,0,0.42);
        box-sizing: border-box;
        width: calc(100% - 12px);
    }
    .seq-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .seq-section {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .seq-title {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--text-dim);
        margin-right: 4px;
    }
    .seq-btn {
        background: #080808;
        border: 1px solid #444;
        color: var(--text-dim);
        font-family: 'Oswald', sans-serif;
        font-size: 9.5px;
        letter-spacing: 1.2px;
        padding: 3px 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition: 0.1s;
    }
    .seq-btn:hover { background: #222; color: #fff; }
    .seq-btn.active { background: #fff; color: #000; border-color: #fff; }

    .seq-btn.v-sel[data-v="0"].active { background: var(--c-green); border-color: var(--c-green); color: #000; box-shadow: 0 0 8px rgba(0,255,68,0.5); }
    .seq-btn.v-sel[data-v="1"].active { background: var(--c-amber); border-color: var(--c-amber); color: #000; box-shadow: 0 0 8px rgba(255,157,0,0.5); }
    .seq-btn.v-sel[data-v="2"].active { background: var(--c-cyan);  border-color: var(--c-cyan);  color: #000; box-shadow: 0 0 8px rgba(0,170,255,0.5); }
    .seq-btn.v-sel[data-v="3"].active { background: var(--c-red);   border-color: var(--c-red);   color: #000; box-shadow: 0 0 8px rgba(255,68,68,0.5); }

    #btn-seq-on.active {
        background: var(--c-green);
        border-color: var(--c-green);
        color: #000;
        box-shadow: 0 0 10px rgba(0,255,68,0.45);
    }
    #btn-mod-mode.active {
        background: var(--c-red);
        border-color: var(--c-red);
        color: #000;
        box-shadow: 0 0 12px var(--c-red);
    }
    #btn-hold-mode.active {
        background: var(--c-amber);
        border-color: var(--c-amber);
        color: #000;
    }
    #btn-len { cursor: ns-resize; touch-action: none; }

    /* UNIFIED MOSAIC ALTAR + 4-LANE SCANLINE MATRIX */
    #altar-matrix-wrap {
        width: 100%;
        background: #040404;
        border: 1px solid #262626;
        padding: 4px 6px 2px 6px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 2px;
        box-shadow: inset 0 0 25px rgba(0,0,0,0.95);
    }
    .ascii-lanes {
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-bottom: 1px dashed #222;
        padding-bottom: 3px;
    }
    .ascii-lane-row {
        display: grid;
        grid-template-columns: 28px repeat(16, 1fr) 36px;
        align-items: center;
        height: 15px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        letter-spacing: 0px;
    }
    .ascii-lane-row.selected-lane {
        background: rgba(255,255,255,0.04);
    }
    .lane-tag {
        font-weight: bold;
        cursor: pointer;
        padding-left: 3px;
        font-size: 10px;
    }
    .lane-len-tag {
        font-size: 9px;
        color: #666;
        text-align: right;
        padding-right: 3px;
        cursor: ns-resize;
    }
    .ascii-cell {
        text-align: center;
        cursor: pointer;
        color: #333;
        font-weight: bold;
        line-height: 15px;
        transition: color 0.05s, text-shadow 0.05s;
        user-select: none;
    }
    .ascii-cell:nth-child(4n+2) {
        border-left: 1px solid #1c1c1c;
    }
    .ascii-cell:hover {
        color: #999;
        background: rgba(255,255,255,0.05);
    }
    .ascii-cell.out-bounds {
        opacity: 0.18;
    }
    .ascii-cell.trig-on[data-l="0"] { color: var(--c-green); text-shadow: 0 0 6px var(--c-green); }
    .ascii-cell.trig-on[data-l="1"] { color: var(--c-amber); text-shadow: 0 0 6px var(--c-amber); }
    .ascii-cell.trig-on[data-l="2"] { color: var(--c-cyan);  text-shadow: 0 0 6px var(--c-cyan); }
    .ascii-cell.trig-on[data-l="3"] { color: var(--c-red);   text-shadow: 0 0 6px var(--c-red); }

    .ascii-cell.has-plock {
        color: var(--c-red) !important;
        text-shadow: 0 0 8px var(--c-red) !important;
    }
    .ascii-cell.playhead {
        color: #fff !important;
        background: rgba(255,255,255,0.16);
        text-shadow: 0 0 8px #fff;
    }
    .ascii-cell.mod-editing {
        color: #fff !important;
        background: rgba(255, 68, 68, 0.45) !important;
        box-shadow: 0 0 8px var(--c-red);
    }

    #ascii-bed {
        font-family: 'Courier New', Courier, monospace;
        font-size: 9px;
        line-height: 9px;
        letter-spacing: 0px;
        white-space: pre;
        margin: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-image: linear-gradient(90deg, #00ff44, #ff9d00, #00aaff, #ff4444);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 0 5px rgba(0, 255, 68, 0.45));
    }
</style>
</head>
<body>
<div id="chassis">
    <div class="vertical-text">MNEMOSYNE</div>
    <div class="panel-core">
        
        <!-- COLUMN 1: SYSTEM & OLED -->
        <div class="column col-sys" data-col="sys">
            <div class="col-header" id="hdr-sys">SYSTEM</div>
            <div class="oled-container">
                <canvas id="scope" title="Click to toggle Seismograph"></canvas>
                <div class="oled-row">
                    <button class="oled-btn" id="btn-activate">ACTIVATE</button>
                    <button class="oled-btn" id="btn-scatter">SCATTER</button>
                </div>
                <div class="oled-row">
                    <button class="oled-btn" id="btn-dump">DUMP</button>
                    <button class="oled-btn" id="btn-rec">REC</button>
                    <button class="oled-btn" id="btn-drift">DRIFT</button>
                </div>
                <div class="oled-row" style="margin-bottom: 5px;">
                    <div style="display:flex; flex: 1; align-items:center; justify-content:center; background:#111; border:1px solid #333; padding:0 2px;">
                        <button class="oled-btn" id="btn-a" style="border:none; padding:2px; min-width:15px; color:#aaa;">A</button>
                        <input type="range" id="ab-slider" min="0" max="1" step="0.001" value="0" style="width: 50px; flex: none; margin: 0 10px; height: 2px; -webkit-appearance: none; background: #555; outline: none;">
                        <button class="oled-btn" id="btn-b" style="border:none; padding:2px; min-width:15px; color:#aaa;">B</button>
                    </div>
                </div>
                <select id="preset-list" style="margin-bottom: 5px;"><option value="init">INITIALIZED</option></select>
                
                <div class="oled-row" style="margin-top: 5px;">
                    <button class="oled-btn" id="btn-mic">MIC</button>
                    <button class="oled-btn" id="btn-file">FILE</button>
                    <input type="file" id="file-upload" accept="audio/*" style="display:none;">
                </div>
                <button class="oled-btn freeze" id="btn-freeze" style="width:100%;">FREEZE</button>
            </div>
            
            <div class="knob-row">
                <div class="knob-container"><div class="knob-label">FAULT</div><svg class="knob-svg" id="fault" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                <div class="knob-container"><div class="knob-label">SEEP</div><svg class="knob-svg" id="seep" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
            </div>
            <div class="knob-group"><div class="knob-container"><div class="knob-label">ANDAMENTO</div><svg class="knob-svg" id="andamento" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
        </div>

        <!-- COLUMN 2: I. PATINA -->
        <div class="column col-pat" data-col="pat">
            <div class="col-header" id="hdr-pat">I. PATINA</div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">CADENCE</div><svg class="knob-svg" id="cadence" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            <div class="knob-row" style="margin-top: 30px;">
                <div class="knob-container"><div class="knob-label">INDEX</div><svg class="knob-svg" id="index" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                <div class="knob-container"><div class="knob-label">EROSION</div><svg class="knob-svg" id="erosion" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
            </div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">SILICA</div><svg class="knob-svg" id="silica" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
        </div>

        <!-- COLUMN 3: II. TESSELLATION -->
        <div class="column col-tes" data-col="tes">
            <div class="col-header" id="hdr-tes">II. TESSELLATION</div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">BLOCK</div><svg class="knob-svg" id="block" data-val="0.8" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            <div class="knob-row" style="margin-top: 30px;">
                <div class="knob-container"><div class="knob-label">TILE</div><svg class="knob-svg" id="tile" data-val="0.5" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                <div class="knob-container"><div class="knob-label">FRAG</div><svg class="knob-svg" id="fragment" data-val="0.3" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
            </div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">FRIT</div><svg class="knob-svg" id="frit" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
        </div>

        <!-- COLUMN 4: III. DESCENT -->
        <div class="column col-des" data-col="des">
            <div class="col-header" id="hdr-des">III. DESCENT</div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">UNDERTOW</div><svg class="knob-svg" id="undertow" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
            <div class="knob-row" style="margin-top: 30px;">
                <div class="knob-container"><div class="knob-label">CANTOR</div><svg class="knob-svg" id="cantor" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
                <div class="knob-container"><div class="knob-label">LETHE</div><svg class="knob-svg" id="lethe" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div>
            </div>
            <div class="knob-group" style="margin-top: 30px;"><div class="knob-container"><div class="knob-label">SCATTER</div><svg class="knob-svg" id="scatter" data-val="0" viewBox="0 0 44 44"><circle class="knob-bg" cx="22" cy="22" r="18"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg></div></div>
        </div>
    </div>
    <div class="vertical-text">SHATTER ENGINE</div>

    <!-- SHATTER MATRIX SEQUENCER SHELF -->
    <div id="seq-shelf">
        <div class="seq-bar">
            <div class="seq-section">
                <span class="seq-title">SHATTER MATRIX</span>
                <button class="seq-btn v-sel active" data-v="0" title="Lane 1: Head I (Block) + Any Param Locks">1. HEAD I</button>
                <button class="seq-btn v-sel" data-v="1" title="Lane 2: Head II (Tile) + Any Param Locks">2. HEAD II</button>
                <button class="seq-btn v-sel" data-v="2" title="Lane 3: Head III (Frag) + Any Param Locks">3. HEAD III</button>
                <button class="seq-btn v-sel" data-v="3" title="Lane 4: Head IV (Frit) + Any Param Locks">4. HEAD IV</button>
            </div>
            <div class="seq-section">
                <button class="seq-btn active" id="btn-seq-on" title="Master Sequencer On/Off">SEQ: ON</button>
                <button class="seq-btn" id="btn-mod-mode" title="MOD OFF: Click steps to add/remove playback triggers | MOD ON: Click active step to lock/clear any dial">MOD</button>
                <button class="seq-btn active" id="btn-hold-mode" title="HOLD: Locked dials sustain until next active step | REV: Revert to base dials on empty steps">HOLD</button>
                <button class="seq-btn" id="btn-len" title="Click to cycle 16/32/48/64, Drag vertically for 1-64, or Alt-Click any step">LEN: 16</button>
                <button class="seq-btn" id="btn-view-page" title="Switch 16-step page window">PG: 1/1</button>
                <button class="seq-btn" id="btn-clr-lane" title="MOD ON: Clear locks on lane | MOD OFF: Clear all steps & locks on lane">CLR</button>
                <div style="display:flex; align-items:center; gap:5px; margin-left:4px; padding-left:6px; border-left:1px solid #333;">
                    <span class="knob-label" style="margin:0; color:var(--c-amber); font-size:9px;">PACE</span>
                    <svg class="knob-svg" id="seq_pace" data-val="0.38" viewBox="0 0 44 44" style="width:28px; height:28px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-amber);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                    <span class="knob-label" style="margin:0 0 0 4px; color:var(--c-red); font-size:9px;">DRAG</span>
                    <svg class="knob-svg" id="seq_drag" data-val="0.0" viewBox="0 0 44 44" style="width:28px; height:28px;"><circle class="knob-bg" cx="22" cy="22" r="18" style="stroke:var(--c-red);"></circle><line class="knob-indicator" x1="22" y1="22" x2="22" y2="8"></line></svg>
                </div>
            </div>
        </div>
        <div id="altar-matrix-wrap">
            <div class="ascii-lanes" id="ascii-lanes"></div>
            <div id="ascii-bed"></div>
        </div>
    </div>
</div>

<script>
function fitToScreen() {
    const chassis = document.getElementById('chassis');
    chassis.style.transform = 'none'; 
    const rect = chassis.getBoundingClientRect();
    const padding = 20; 
    const scaleX = window.innerWidth / (rect.width + padding);
    const scaleY = window.innerHeight / (rect.height + padding);
    const scale = Math.min(1, scaleX, scaleY); 
    chassis.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 50);

const workletString = `
class SafeDelay {
    constructor(size) { this.size = size; this.buf = new Float32Array(size); this.writeIdx = 0; }
    write(val) { if(isNaN(val)) val = 0; this.buf[this.writeIdx] = val; this.writeIdx = (this.writeIdx + 1) % this.size; }
    read(sAgo) {
        if(isNaN(sAgo)) sAgo = 0; sAgo = Math.max(0, Math.min(sAgo, this.size - 2)); 
        let rPos = this.writeIdx - sAgo; while(rPos < 0) rPos += this.size;
        let i1 = Math.floor(rPos); let i2 = (i1 + 1) % this.size; let frac = rPos - i1;
        return this.buf[i1] + frac * (this.buf[i2] - this.buf[i1]);
    }
}
class MnemoProcessor extends AudioWorkletProcessor {
    constructor() {
        super();

        if (e.data.type === 'seq_tick' && seqOn) {
            advanceSequencer();
        } else if (e.data.type === 'telemetry') {
            liveHeads = e.data.heads;
            liveShatterAct = e.data.shatter_act;
        }
    };
    
    extGain = audioCtx.createGain(); extGain.connect(mnemoNode);
    analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 512; scopeData = new Uint8Array(analyzer.frequencyBinCount);
    
    recNode = audioCtx.createScriptProcessor(4096, 2, 2);
    recNode.onaudioprocess = function(e) {
        if (!isRecording) return;
        recBuffersL.push(new Float32Array(e.inputBuffer.getChannelData(0))); recBuffersR.push(new Float32Array(e.inputBuffer.getChannelData(1))); recLength += e.inputBuffer.getChannelData(0).length;
    };

    mnemoNode.connect(analyzer); analyzer.connect(audioCtx.destination);
    mnemoNode.connect(recNode); recNode.connect(audioCtx.destination);
    
    isPlaying = true; document.getElementById('btn-activate').classList.add('active'); syncAllParams();
}

document.querySelectorAll('.knob-svg').forEach(knob => {
    let isDragging = false, startY, startVal;
    setKnobVisual(knob, baseParams[knob.id]);
    knob.addEventListener('pointerdown', e => {
        isDragging = true; startY = e.clientY; startVal = parseFloat(knob.dataset.val);
        knob.setPointerCapture(e.pointerId); e.preventDefault();
    });
    window.addEventListener('pointermove', e => {
        if(!isDragging) return;
        let delta = (startY - e.clientY) * 0.005;
        setKnobValue(knob, startVal + delta, 'user');
    });
    window.addEventListener('pointerup', e => {
        if(isDragging) { isDragging = false; try { knob.releasePointerCapture(e.pointerId); } catch(err){} }
    });
});

document.getElementById('btn-activate').addEventListener('click', (e) => {

let stateA = null, stateB = null;
document.getElementById('btn-a').addEventListener('click', (e) => { stateA = { ...baseParams }; e.target.style.color = '#fff'; document.getElementById('btn-b').style.color = '#aaa'; document.getElementById('ab-slider').value = 0; });
document.getElementById('btn-b').addEventListener('click', (e) => { stateB = { ...baseParams }; e.target.style.color = '#fff'; document.getElementById('btn-a').style.color = '#aaa'; document.getElementById('ab-slider').value = 1; });
document.getElementById('ab-slider').addEventListener('input', (e) => {

let isFrozen = false;
document.getElementById('btn-freeze').addEventListener('click', (e) => {

document.getElementById('btn-mic').addEventListener('click', async (e) => {
    if(!audioCtx) await initAudio();
    if(micStream) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micStream = audioCtx.createMediaStreamSource(stream);
        if(fileSource) { fileSource.disconnect(); fileSource = null; document.getElementById('btn-file').classList.remove('active'); }
        micStream.connect(extGain);
        e.target.classList.add('active');
    } catch(err) { alert('Microphone access denied or unavailable.'); }
});

document.getElementById('btn-file').addEventListener('click', () => { document.getElementById('file-upload').click(); });
document.getElementById('file-upload').addEventListener('change', async (e) => {
    if(!audioCtx) await initAudio();
    let file = e.target.files[0]; if(!file) return;
    let reader = new FileReader();
    reader.onload = async function(ev) {
        let audioData = await audioCtx.decodeAudioData(ev.target.result);
        if(micStream) { micStream.disconnect(); micStream = null; document.getElementById('btn-mic').classList.remove('active'); }
        if(fileSource) { fileSource.disconnect(); }
        fileSource = audioCtx.createBufferSource();
        fileSource.buffer = audioData; fileSource.loop = true;
        fileSource.connect(extGain); fileSource.start(0);
        document.getElementById('btn-file').classList.add('active');
    };
    reader.readAsArrayBuffer(file);
});

document.getElementById('btn-rec').addEventListener('click', (e) => {
    if(!audioCtx) return;
    if (!isRecording) { isRecording = true; recBuffersL = []; recBuffersR = []; recLength = 0; e.target.style.background = 'var(--c-red)'; e.target.style.color = '#000'; } 
    else { isRecording = false; e.target.style.background = 'transparent'; e.target.style.color = '#fff'; exportWAV(); }
});
function exportWAV() {
    let interleaved = new Float32Array(recLength * 2); let offset = 0;
    for (let i = 0; i < recBuffersL.length; i++) { let bufL = recBuffersL[i]; let bufR = recBuffersR[i]; for (let j = 0; j < bufL.length; j++) { interleaved[offset++] = bufL[j]; interleaved[offset++] = bufR[j]; } }
    let buffer = new ArrayBuffer(44 + interleaved.length * 2); let view = new DataView(buffer);
    let writeString = function(view, offset, string) { for (let i=0; i<string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
    writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + interleaved.length * 2, true); writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 2, true);
    view.setUint32(24, audioCtx.sampleRate, true); view.setUint32(28, audioCtx.sampleRate * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true);
    writeString(view, 36, 'data'); view.setUint32(40, interleaved.length * 2, true);
    let o = 44; for (let i = 0; i < interleaved.length; i++, o += 2) { let s = Math.max(-1, Math.min(1, interleaved[i])); view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
    let blob = new Blob([view], { type: 'audio/wav' }); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.style.display = 'none'; a.href = url;
    let pName = document.getElementById('preset-list').value; a.download = `MNEMOSYNE_${pName === 'init' ? 'RAW' : pName.replace(' ', '_')}.wav`;
    document.body.appendChild(a); a.click(); URL.revokeObjectURL(url);
}

const words1 = ["EIDOLON", "SILICA", "LETHE", "CANTOR", "STRATUM", "PALE", "DUSK", "MOSAIC"];
const words2 = ["WASH", "DUST", "FAULT", "TIDE", "FRIT", "SHATTER", "VEIL", "ECHO"];

    const list = document.getElementById('preset-list'); list.innerHTML = '<option value="init">INITIALIZED</option>';
    for(let pName in presets) { let opt = document.createElement('option'); opt.value = pName; opt.textContent = pName; list.appendChild(opt); }
}

    let state = { ...baseParams };
    presets[name] = state; localStorage.setItem('mnemosyne_presets_v1', JSON.stringify(presets)); refreshPresetList(); document.getElementById('preset-list').value = name;

    if(state) { for(let key in state) { let el = document.getElementById(key); if(el && el.classList.contains('knob-svg')) setKnobValue(el, state[key], 'preset'); } }
});

// --- 4-LANE SHATTER MATRIX SEQUENCER ---
const asciiLanesContainer = document.getElementById('ascii-lanes');
const lenBtn = document.getElementById('btn-len');
const pageBtn = document.getElementById('btn-view-page');

function updateLenUI() {
    let l = laneLengths[activeTrack];
    lenBtn.textContent = `LEN: ${l}`;
    let maxPages = Math.max(1, Math.ceil(l / 16));
    if (viewPage >= maxPages) viewPage = maxPages - 1;
    pageBtn.textContent = `PG: ${viewPage + 1}/${maxPages}`;
}

function selectLane(v) {
    activeTrack = v;
    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === v));
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    updateLenUI();
    syncKnobsToEditState();
    renderAsciiLanes();
}

function syncKnobsToEditState() {
    document.querySelectorAll('.knob-svg').forEach(k => {
        if (k.id === 'seq_pace' || k.id === 'seq_drag') return;
        k.classList.remove('plocked');
        if (modMode && editingStep !== null) {
            const locks = seqTracks[activeTrack][editingStep].locks;
            if (locks[k.id] !== undefined) {
                k.classList.add('plocked');
            }
        }
    });
}

function renderAsciiLanes() {
    asciiLanesContainer.innerHTML = '';
    const offset = viewPage * 16;

    for (let l = 0; l < 4; l++) {
        const row = document.createElement('div');
        row.className = 'ascii-lane-row' + (l === activeTrack ? ' selected-lane' : '');

        const tag = document.createElement('div');
        tag.className = 'lane-tag';
        tag.style.color = laneColors[l];
        tag.textContent = laneLabels[l];
        tag.title = `Select Lane ${laneLabels[l]}`;
        tag.addEventListener('click', () => selectLane(l));
        row.appendChild(tag);

        const activeLen = laneLengths[l];
        for (let i = 0; i < 16; i++) {
            const stepIdx = offset + i;
            const stepObj = seqTracks[l][stepIdx];
            const cell = document.createElement('div');
            cell.className = 'ascii-cell';
            cell.dataset.l = l;

            const hasLocks = Object.keys(stepObj.locks).length > 0;
            const isPlayhead = isPlaying && seqOn && playSteps[l] === stepIdx;
            const isEditing = modMode && l === activeTrack && editingStep === stepIdx;

            if (stepIdx >= activeLen) cell.classList.add('out-bounds');
            if (stepObj.trig) cell.classList.add('trig-on');
            if (hasLocks) cell.classList.add('has-plock');
            if (isPlayhead) cell.classList.add('playhead');
            if (isEditing) cell.classList.add('mod-editing');

            if (isEditing) {
                cell.textContent = '[#]';
            } else if (isPlayhead) {
                cell.textContent = stepObj.trig ? '[|]' : ' · ';
            } else if (stepObj.trig) {
                cell.textContent = hasLocks ? ' ‡ ' : ' | ';
            } else {
                cell.textContent = ' · ';
            }

            cell.addEventListener('click', e => {
                if (activeTrack !== l) {
                    activeTrack = l;
                    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === l));
                    updateLenUI();
                }

                if (e.altKey) {
                    laneLengths[l] = stepIdx + 1;
                    if (playSteps[l] >= laneLengths[l]) playSteps[l] = 0;
                    updateLenUI();
                    renderAsciiLanes();
                    return;
                }

                if (!modMode) {
                    stepObj.trig = !stepObj.trig;
                    if (!stepObj.trig) {
                        stepObj.locks = {};
                    } else if (mnemoNode) {
                        mnemoNode.port.postMessage({ type: 'head_trigger', lane: l });
                    }
                    editingStep = null;
                    renderAsciiLanes();
                } else {
                    if (editingStep === stepIdx) {
                        stepObj.locks = {};
                        syncKnobsToEditState();
                    } else {
                        stepObj.trig = true;
                        editingStep = stepIdx;
                        syncKnobsToEditState();
                    }
                    renderAsciiLanes();
                }
            });

            cell.addEventListener('dblclick', () => {
                if (modMode) {
                    stepObj.locks = {};
                    syncKnobsToEditState();
                    renderAsciiLanes();
                }
            });

            row.appendChild(cell);
        }

        const lenTag = document.createElement('div');
        lenTag.className = 'lane-len-tag';
        lenTag.textContent = `/${ String(activeLen).padStart(2, '0') }`;
        lenTag.title = 'Click to select lane';
        lenTag.addEventListener('click', () => selectLane(l));
        row.appendChild(lenTag);

        asciiLanesContainer.appendChild(row);
    }
}
updateLenUI();
renderAsciiLanes();

document.querySelectorAll('.v-sel').forEach(btn => {
    btn.addEventListener('click', e => {
        selectLane(parseInt(e.target.dataset.v));
    });
});

document.getElementById('btn-seq-on').addEventListener('click', e => {
    seqOn = !seqOn;
    e.target.classList.toggle('active', seqOn);
    e.target.textContent = seqOn ? 'SEQ: ON' : 'SEQ: OFF';
    if (!seqOn) {
        for (let pId of allSynthParams) {
            applyTargetParam(pId, baseParams[pId], false);
        }
    }
    renderAsciiLanes();
});

document.getElementById('btn-mod-mode').addEventListener('click', e => {
    modMode = !modMode;
    e.target.classList.toggle('active', modMode);
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    syncKnobsToEditState();
    renderAsciiLanes();
});

document.getElementById('btn-hold-mode').addEventListener('click', e => {
    holdMode = !holdMode;
    e.target.classList.toggle('active', holdMode);
});

let lenDragging = false, lenStartY = 0, lenStartVal = 16, lenMoved = false;
lenBtn.addEventListener('pointerdown', e => {
    lenDragging = true; lenMoved = false; lenStartY = e.clientY; lenStartVal = laneLengths[activeTrack];
    lenBtn.setPointerCapture(e.pointerId); e.preventDefault();
});
window.addEventListener('pointermove', e => {
    if (!lenDragging) return;
    let dy = lenStartY - e.clientY;
    if (Math.abs(dy) > 4) {
        lenMoved = true;
        let newLen = Math.max(1, Math.min(64, Math.round(lenStartVal + dy * 0.25)));
        laneLengths[activeTrack] = newLen;
        if (playSteps[activeTrack] >= newLen) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});
window.addEventListener('pointerup', e => {
    if (!lenDragging) return;
    lenDragging = false;
    try { lenBtn.releasePointerCapture(e.pointerId); } catch(err){}
    if (!lenMoved) {
        let cur = laneLengths[activeTrack];
        laneLengths[activeTrack] = cur < 16 ? 16 : (cur < 32 ? 32 : (cur < 48 ? 48 : (cur < 64 ? 64 : 16)));
        if (playSteps[activeTrack] >= laneLengths[activeTrack]) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});

pageBtn.addEventListener('click', () => {
    let maxPages = Math.max(1, Math.ceil(laneLengths[activeTrack] / 16));
    viewPage = (viewPage + 1) % maxPages;
    updateLenUI();
    renderAsciiLanes();
});

document.getElementById('btn-clr-lane').addEventListener('click', () => {
    for (let s = 0; s < 64; s++) {
        seqTracks[activeTrack][s].locks = {};
        if (!modMode) seqTracks[activeTrack][s].trig = false;
    }
    editingStep = null;
    syncKnobsToEditState();
    renderAsciiLanes();
});

function applyTargetParam(kId, targetVal, isLocked) {
    liveParams[kId] = targetVal;
    sendParam(kId, targetVal);
    if (!modMode || editingStep === null) {
        const knobEl = document.getElementById(kId);
        if (knobEl) {
            setKnobVisual(knobEl, targetVal);
            knobEl.classList.toggle('mod-active', isLocked);
        }
    }
}

function advanceSequencer() {
    if (!seqOn) return;
    let combinedLocks = {};

    for (let l = 0; l < 4; l++) {
        playSteps[l] = (playSteps[l] + 1) % laneLengths[l];
        const stepObj = seqTracks[l][playSteps[l]];

        if (stepObj.trig) {
            if (mnemoNode) {
                mnemoNode.port.postMessage({ type: 'head_trigger', lane: l });
            }
            for (let kId in stepObj.locks) {
                combinedLocks[kId] = stepObj.locks[kId];
            }
        }
    }

    for (let kId in combinedLocks) {
        applyTargetParam(kId, combinedLocks[kId], true);
    }
    renderAsciiLanes();
}

// --- MOSAIC SHATTER CANOPY ASCII ENGINE ---
const asciiBed = document.getElementById('ascii-bed');
let mosaicPhase = 0;

function updateMosaicGradient(shatter) {
    const eros = liveParams['erosion'] || 0;
    const sil = liveParams['silica'] || 0;
    const letv = liveParams['lethe'] || 0;
    
    const c1 = `rgb(${Math.round(30 + shatter * 200)}, ${Math.round(220 - eros * 100)}, ${Math.round(80 + letv * 150)})`;
    const c2 = `rgb(255, ${Math.round(160 - sil * 90)}, ${Math.round(50 + shatter * 150)})`;
    const c3 = `rgb(${Math.round(40 + sil * 160)}, ${Math.round(180 - eros * 80)}, 255)`;
    const c4 = `rgb(${Math.round(20 + shatter * 220)}, ${Math.round(210 - sil * 100)}, ${Math.round(100 + shatter * 120)})`;

    asciiBed.style.backgroundImage = `linear-gradient(90deg, ${c1} 12%, ${c2} 38%, ${c4} 52%, ${c3} 74%, ${c2} 92%)`;
    asciiBed.style.filter = `drop-shadow(0 0 ${4 + shatter * 12}px rgba(0, 255, 68, ${0.4 + shatter * 0.45}))`;
}

function renderAsciiMosaic() {
    const eros = liveParams['erosion'] || 0;
    const sil = liveParams['silica'] || 0;
    const fault = liveParams['fault'] || 0;
    const under = liveParams['undertow'] || 0;
    
    const chaos = Math.min(1.0, Math.max(0.0, eros * 0.5 + sil * 0.3 + fault * 0.2 + liveShatterAct * 0.7));
    updateMosaicGradient(chaos);

    mosaicPhase += 0.15 + chaos * 0.4;
    const cols = 136;
    const rows = 6;
    const grid = Array.from({ length: rows }, () => new Array(cols).fill(' '));

    if (isPlaying && seqOn) {
        const offset = viewPage * 16;
        const scanSym = ['#', '=', ':', 'x'];
        for (let l = 0; l < 4; l++) {
            let pStep = playSteps[l];
            if (pStep >= offset && pStep < offset + 16) {
                let colSlot = pStep - offset;
                let scanX = Math.round(6 + (colSlot + 0.5) * ((cols - 12) / 16));
                let isTrig = seqTracks[l][pStep] && seqTracks[l][pStep].trig;
                if (isTrig) {
                    for (let r = 0; r < rows; r++) {
                        if (scanX >= 0 && scanX < cols) grid[r][scanX] = r % 2 === 0 ? scanSym[l] : ':';
                    }
                }
            }
        }
    }

    const blockWidth = 14;
    const numBlocks = 8;
    for (let b = 0; b < numBlocks; b++) {
        let bx = 4 + b * blockWidth;
        let headActivity = liveHeads[b % 4];
        let isShattered = chaos > 0.3 || headActivity > 0.2;

        for (let r = 1; r <= 4; r++) {
            for (let w = 0; w < blockWidth - 2; w++) {
                let px = bx + w;
                if (px >= 0 && px < cols) {
                    if (!isShattered) {
                        if (r === 1 || r === 4) {
                            grid[r][px] = w === 0 || w === blockWidth - 3 ? '+' : '-';
                        } else {
                            grid[r][px] = w === 0 || w === blockWidth - 3 ? '|' : (w % 2 === 0 ? '#' : '=');
                        }
                    } else {
                        let drift = Math.round(Math.sin(mosaicPhase + px * 0.3 + b) * (chaos * 6.0 + under * 4.0));
                        let spx = Math.max(0, Math.min(cols - 1, px + drift));
                        let shardChars = ".:;~=*+#%@\\/x+";
                        let charIdx = Math.abs(Math.floor(Math.sin(mosaicPhase * 2 + px) * shardChars.length));
                        grid[r][spx] = shardChars[charIdx % shardChars.length];
                    }
                }
            }
        }
    }

    asciiBed.textContent = grid.map(row => row.join('')).join('\n');
}

setInterval(renderAsciiMosaic, 60);
renderAsciiMosaic();
